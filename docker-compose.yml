services:
  preview:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: shaswot-homepage:20260805
    container_name: shaswot-homepage-preview
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      # Binds current local directory to /site in the container
      - ./:/site
    # Starts the server
    # --host 0.0.0.0 is strictly required in Docker so the port is accessible externally
    # --force_polling ensures Jekyll detects file saves across the Docker volume boundary
    # --livereload automatically refreshes your browser when you save a file
    command: >
      bash -c "bundle exec jekyll serve --host 0.0.0.0 --livereload --force_polling"